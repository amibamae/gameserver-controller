schema_version: 1

controller:
  mode: local
  state_store:
    type: bbolt
    path: ./var/controller.db
  management_api:
    enabled: false
    listen_address: 127.0.0.1:8443
    audience: controller-instance-1
    tls_certificate_file: /etc/gameserver-controller/tls.crt
    tls_private_key_file: /etc/gameserver-controller/tls.key
  # Required when the management API is enabled. Create the key with
  # controller-setup credentials generate; never type it in by hand.
  idempotency_keys:
    active: v1
    versions:
      v1: systemd-credential://controller-idempotency-key-v1
  defaults:
    operation_timeout: 15m
    retry_limit: 2
  audit:
    enabled: true
    destination: local

adapters:
  - id: hosting.example
    category: hosting
    secret_refs:
      api_token:
        secret_ref: systemd-credential://example-vultr-api-token
        purpose: example Vultr provisioning credential
        permission_scope:
          - hosting.instance.create
          - hosting.instance.inspect
  - id: storage.example
    category: storage
    secret_refs:
      backup_writer:
        secret_ref: systemd-credential://example-wasabi-staging-writer
        purpose: example staging backup storage access
        permission_scope:
          - storage.backup.write
  - id: execution.example
    category: execution
  - id: game.paper
    category: game

environments:
  - id: production
    classification: production
    production_backup_access: read_write
  - id: staging
    classification: staging
    production_backup_access: read_only

servers:
  # Production may remain live outside controller-managed inventory.
  - id: pilot-test-server
    environment_id: staging
    adapters:
      hosting: hosting.example
      storage: storage.example
      execution: execution.example
      game: game.paper
    lifecycle:
      idle_shutdown: 30m
      require_verified_backup_before_destroy: true
      require_approval_for_destroy: true
      backups:
        schedule:
          every: 9
          unit: hours
        retention:
          keep_last: 5
    # Optional network profile; see docs/CONFIGURATION.md. Requires the
    # referenced integration adapter profiles above.
    # network:
    #   join_mode: proxy
    #   proxy: integration.velocity
    #   backends:
    #     - id: paper-main
    #       address_mode: instance_ip
    #       port: 25565
