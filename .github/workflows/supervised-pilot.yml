name: Supervised pilot build

on:
  push:
    paths:
      - "cmd/supervised-pilot/**"
      - "pilot/**"
      - "docs/SUPERVISED_PILOT.md"
      - ".github/workflows/supervised-pilot.yml"
      - "go.mod"
      - "go.sum"
  pull_request:
    paths:
      - "cmd/supervised-pilot/**"
      - "pilot/**"
      - "docs/SUPERVISED_PILOT.md"
      - ".github/workflows/supervised-pilot.yml"
      - "go.mod"
      - "go.sum"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l cmd/supervised-pilot)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            gofmt -d cmd/supervised-pilot
            exit 1
          fi
      - name: Build supervised pilot
        run: go build -o /tmp/gsc-pilot ./cmd/supervised-pilot
      - name: Test supervised pilot
        run: go test ./...
      - name: Validate declarative VM capacity policy
        run: python3 pilot/validate_capacity_policy.py

