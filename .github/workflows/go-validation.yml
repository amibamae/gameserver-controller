name: Go validation

on:
  push:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "configs/**"
      - "internal/pilotcapacity/**"
      - "docs/CONFIGURATION.md"
      - "docs/ROADMAP.md"
      - ".github/workflows/go-validation.yml"
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "configs/**"
      - "internal/pilotcapacity/**"
      - "docs/CONFIGURATION.md"
      - "docs/ROADMAP.md"
      - ".github/workflows/go-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Test Go implementation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history, so the complexity check can diff against the base branch.
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Download Go dependencies
        run: go mod download
      - name: Verify dependency checksums
        run: go mod verify
      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi
      - name: Test packages
        run: go test -count=1 ./...
      - name: Build packages
        run: go build ./...
      - name: Check for race conditions
        run: go test -race -count=1 ./...
      - name: Vet packages
        run: go vet ./...
      - name: Validate example configuration
        run: go run ./cmd/config-check validate configs/controller.example.yaml
      - name: Validate declarative pilot policy
        run: go run ./cmd/pilot-capacity-check
      - name: Check complexity of changed functions
        # The default PR checkout is a merge commit. Its first parent is the
        # exact base tested, even if the target branch advances during CI.
        if: github.event_name == 'pull_request'
        run: go run ./cmd/complexity-check -base 'HEAD^1'
