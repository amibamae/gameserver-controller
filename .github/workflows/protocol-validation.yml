name: Protocol validation

on:
  push:
    paths:
      - "protocol/**"
      - "cmd/protocol-check/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/protocol-validation.yml"
  pull_request:
    paths:
      - "protocol/**"
      - "cmd/protocol-check/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/protocol-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate protocol package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Download Go dependencies
        run: go mod download
      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l cmd/protocol-check)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            gofmt -d cmd/protocol-check
            exit 1
          fi
      - name: Compile protocol tooling
        run: go test ./...
      - name: Validate schemas, references, examples, OpenAPI metadata, and conformance vectors
        run: go run ./cmd/protocol-check
      - name: Verify conformance package manifest
        run: |
          go run ./cmd/protocol-check -manifest > "$RUNNER_TEMP/conformance-package-manifest.json"
          diff -u protocol/conformance/package-manifest.json "$RUNNER_TEMP/conformance-package-manifest.json"
