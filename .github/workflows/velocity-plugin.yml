name: Velocity plugin

on:
  push:
    paths:
      - "plugins/velocity/**"
      - ".github/workflows/velocity-plugin.yml"
  pull_request:
    paths:
      - "plugins/velocity/**"
      - ".github/workflows/velocity-plugin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test Velocity plugin
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: plugins/velocity
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Build and test
        run: ./gradlew --no-daemon build
