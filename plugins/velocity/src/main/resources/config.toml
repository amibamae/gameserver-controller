# GSC Velocity bridge configuration.
# The bridge API is documented in docs/PROXY_BRIDGE_API.md of the
# gameserver-controller repository.

[bridge]
# Loopback only. The controller runs on the same host as the proxy.
bind = "127.0.0.1"
port = 25580
# File containing the bearer token the controller sends. Keep it readable
# only by the Velocity service user.
token-file = "/etc/gsc/velocity-bridge.token"
# Must match the proxy_instance_ref external_id configured in the controller.
proxy-instance-id = "velocity-edge-001"

[routing]
# Managed backends new players are sent to, in order, when the controller has
# registered them and they pass the health check. Leave empty to keep
# Velocity's own "try" list behavior.
join-backends = []
# Statically configured server players wait on when no join backend is
# routable, or when their backend goes down. Usually the lobby.
fallback = "lobby"
# Send players back to the fallback (instead of disconnecting them) when a
# managed backend kicks them because it went down.
fallback-on-kick = true
# Seconds between backend health checks.
health-check-seconds = 5
# Move players who are waiting on the fallback to their server once the
# controller has registered it and it passes the health check. Players who
# went to the fallback themselves are not moved. Players can still use
# /server to go sooner.
auto-move = true
# How many waiting players to move per server each interval.
auto-move-batch = 5
auto-move-interval-seconds = 5

# Per-hostname join backends. Players who connect through one of these
# hostnames use this list instead of join-backends.
[routing.forced-hosts]
# "survival.example.com" = ["paper-main"]

# Start-up safety locks. All are enforced by default. Disable one only when
# you know why you must: every bypass is logged as a warning at start-up.
[security]
# Reject start-up when the token file is readable by group or others.
# Disable to read a token from a file that cannot be made owner-only.
enforce-token-permissions = true
# Reject start-up when bridge.bind is not a loopback address. Disable to
# expose the bridge API on a non-loopback address; firewall the port to the
# controller host if you do.
enforce-loopback-bind = true
# Reject start-up when routing.fallback names a server that is not already
# in velocity.toml. Off by default because the controller registers managed
# backends (including the fallback) at runtime through the bridge API, so the
# server does not need to exist in velocity.toml at start-up. Enable it for
# static deployments where every server must exist in velocity.toml before
# the proxy starts.
enforce-fallback = false

# TLS for the bridge API. On by default: the plugin terminates TLS and checks
# the controller's client certificate against controller-ca-file (mTLS). The
# bearer token in [bridge] is still required. The plugin loads these files
# at startup and refuses to start the bridge if they cannot be loaded.
# Restart the proxy after rotating the certificates or key.
[tls]
# Terminate TLS on the bridge port. Setting this to false disables the TLS
# layer entirely and logs a warning at start-up; the bearer token still
# applies. Keep it true unless you can firewall the port to the controller
# host and accept the loss of certificate checking.
enabled = true
# Absolute path to the server certificate (PEM). A public CA certificate
# (e.g. Let's Encrypt) or a manual one both work.
cert-file = "/etc/gsc/velocity-bridge.crt"
# Absolute path to the matching server private key (unencrypted PKCS#8 PEM).
key-file = "/etc/gsc/velocity-bridge.key"
# Absolute path to the CA bundle (PEM, one or more certificates) that signed
# the controller's client certificate. Usually the offline root CA from the
# TLS runbook. While rotating that CA, keep the old and new roots in the same
# file until the rotation is finished.
controller-ca-file = "/etc/gsc/velocity-bridge-controller-ca.pem"
